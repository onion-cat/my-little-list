<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e6e9"><link rel="manifest" href="manifest.webmanifest"><title>My Little List</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#493f44;background:#fffaf8}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px 14px;background:#f9e9ed}h1{font-family:Georgia,serif;font-size:27px;margin:0}small,.muted{color:#927e85}main{max-width:680px;margin:auto;padding:16px 16px 100px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eadde0;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.tabs button{flex:1;max-width:130px;font-size:11px;background:none;color:#74646a;border:0;padding:6px 1px}.tabs button.active{color:#b65778;font-weight:bold}.tabs span{display:block;font-size:21px;margin-bottom:3px}.card{background:white;border:1px solid #eedfe2;border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #7b52600a}.soft{background:#fff1f3}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grow{flex:1;min-width:0}.title{font-weight:700;font-size:16px}h2{font-size:21px;margin:7px 0 15px}h3{font-size:16px}button,.btn{border:0;border-radius:12px;padding:11px 14px;background:#bd718b;color:white;font-weight:600;cursor:pointer}button.secondary{background:#f7e8ec;color:#83576a}button.ghost{background:transparent;color:#986e7c;padding:6px}button:disabled{opacity:.5}input,textarea,select{width:100%;border:1px solid #e5d5da;border-radius:11px;background:#fff;padding:11px;margin:5px 0 12px;font:inherit;color:#493f44}textarea{min-height:88px;resize:vertical}label{display:block;font-size:13px;font-weight:600}input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:#b96685}.pill{font-size:12px;padding:5px 10px;border-radius:20px;background:#f8e8ed;color:#98576f}.mini{font-size:12px}.done{text-decoration:line-through;color:#a99ca1}.hidden{display:none!important}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{padding:7px 11px;font-size:12px}.empty{text-align:center;padding:25px;color:#99888e}details summary{cursor:pointer;font-weight:600;padding:9px 0}.photo{width:55px;height:55px;border-radius:10px;object-fit:cover;background:#f6ecef}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#493f44;color:white;border-radius:15px;padding:10px 18px;display:none;z-index:10;white-space:nowrap} .section{margin-top:20px} .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.two>*{min-width:0} .danger{color:#ae4761!important}a{color:#a85b78}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><header><h1>My Little List ♡</h1><small>好きなものと、暮らしの記録。</small></header><main id="app"></main><nav class="tabs" id="nav"></nav><div id="toast"></div><script>
const tabs=[['home','⌂','ホーム'],['recipes','▤','レシピ'],['shop','▣','買い物'],['wish','♡','欲しいもの'],['dream','✧','やりたいこと']];let state={recipes:[],shop:[],wish:[],dream:[]},page='home',detail=null,shopTab='food',category='すべて',editing=null,ocrDraft=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
let db;async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('my-little-list',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});let saved=await new Promise(res=>{let r=db.transaction('data').objectStore('data').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});if(saved)state={...state,...saved};render()}function save(){let t=db.transaction('data','readwrite');t.objectStore('data').put(state,'state')}function go(p){page=p;detail=null;editing=null;render();scrollTo(0,0)}function itemCard(x,kind){return `<div class="card row"><div class="grow"><div class="title ${x.done?'done':''}">${esc(x.name)}</div><div class="muted mini">${esc(x.note||'')}${x.budget?' · ¥'+esc(x.budget):''}</div></div><button class="secondary" onclick="toggle('${kind}','${x.id}')">${x.done?'戻す':'✓'}</button><button class="ghost" aria-label="削除" onclick="removeItem('${kind}','${x.id}')">×</button></div>`}function toggle(kind,id){state[kind]=state[kind].map(x=>x.id===id?{...x,done:!x.done}:x);save();render()}function removeItem(kind,id){if(!confirm('削除しますか？'))return;state[kind]=state[kind].filter(x=>x.id!==id);save();render()}function formSimple(kind){return `<div class="card soft"><h3>＋ 新しく追加</h3><form onsubmit="addSimple(event,'${kind}')"><label>名前<input name="name" required placeholder="${kind==='wish'?'欲しいもの':'やりたいこと'}"></label>${kind==='wish'?'<label>予算（円）<input name="budget" type="number" min="0"></label><label>商品URL<input name="url" type="url"></label>':''}<label>メモ<textarea name="note" placeholder="自由にメモ"></textarea></label><button>追加する</button></form></div>`}function addSimple(e,kind){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state[kind].unshift({id:uid(),done:false,...d});save();render();toast('追加したよ ♡')}
function recipeCard(r){return `<div class="card row" onclick="openRecipe('${r.id}')" style="cursor:pointer">${r.photo?`<img class="photo" src="${r.photo}">`:'<div class="photo" style="display:grid;place-items:center;color:#bba9b0">■</div>'}<div class="grow"><div class="title">${esc(r.name)}</div><div class="muted mini">${esc(r.category||'その他')} · ${r.rating?'★'.repeat(+r.rating):'未評価'} ${r.cooked?'· 調理済み':''}</div></div><span>›</span></div>`}function render(){let html='';if(page==='home'){html=`<h2>今日の暮らし ♡</h2><div class="two"><div class="card soft" onclick="go('recipes')"><div class="title">▤ レシピ</div><p>${state.recipes.length} 件</p></div><div class="card soft" onclick="go('shop')"><div class="title">▣ 買い物</div><p>${state.shop.filter(x=>!x.done).length} 件</p></div><div class="card" onclick="go('wish')"><div class="title">♡ 欲しいもの</div><p>${state.wish.filter(x=>!x.done).length} 件</p></div><div class="card" onclick="go('dream')"><div class="title">✧ やりたいこと</div><p>${state.dream.filter(x=>!x.done).length} 件</p></div></div><h3>最近のレシピ</h3>${state.recipes.slice(0,3).map(recipeCard).join('')||'<div class="empty">お気に入りのレシピを登録しよう！</div>'}<button class="secondary" onclick="go('settings')">設定・バックアップ</button>`}else if(page==='wish'||page==='dream'){html=`<h2>${page==='wish'?'♡ 欲しいもの':'✧ やりたいこと'}</h2>${formSimple(page)}${state[page].map(x=>itemCard(x,page)).join('')||'<div class="empty">まだ登録がないよ</div>'}`}else if(page==='shop'){let list=state.shop.filter(x=>x.type===shopTab).sort((a,b)=>a.done-b.done);html=`<h2>▣ 買い物リスト</h2><div class="chips"><button class="${shopTab==='food'?'':'secondary'}" onclick="shopTab='food';render()">食材</button><button class="${shopTab==='daily'?'':'secondary'}" onclick="shopTab='daily';render()">日用品</button></div><div class="card soft"><form onsubmit="addShop(event)"><label>買うもの<input name="name" required placeholder="${shopTab==='food'?'例：玉ねぎ':'例：洗剤'}"></label><label>数量・メモ<input name="quantity" placeholder="例：2個、詰め替え用"></label><button>＋ 追加</button></form></div>${list.map(x=>`<div class="card row"><input type="checkbox" aria-label="購入済み" ${x.done?'checked':''} onchange="toggle('shop','${x.id}')"><div class="grow ${x.done?'done':''}"><b>${esc(x.name)}</b><div class="mini muted">${esc(x.quantity||'')}${x.source?' · レシピから':''}</div></div><button class="ghost" onclick="removeItem('shop','${x.id}')">×</button></div>`).join('')||'<div class="empty">買うものはまだないよ</div>'}`;}else if(page==='recipes'){if(detail){let r=state.recipes.find(x=>x.id===detail);if(!r){detail=null;render();return}html=`<button class="secondary" onclick="detail=null;render()">‹ レシピ一覧</button><h2>${esc(r.name)}</h2><div class="chips"><span class="pill">${esc(r.category)}</span><span class="pill">${r.cooked?'作った！':'まだ作ってない'}</span></div>${r.photo?`<img src="${r.photo}" style="max-width:100%;max-height:230px;object-fit:contain;border-radius:12px;margin-top:12px">`:''}<div class="card"><h3>材料・調味料</h3>${(r.ingredients||[]).map((i,n)=>`<label class="row" style="justify-content:start;font-weight:normal"><input type="checkbox" style="width:19px"><span>${esc(i)}</span></label>`).join('')||'<p class="muted">未入力</p>'}<button onclick="recipeToShop('${r.id}')">足りない材料を買い物リストへ</button><p class="mini muted">チェックした材料は追加しないよ</p></div><div class="card"><h3>作り方</h3><pre>${esc(r.steps||'未入力')}</pre></div><div class="card"><h3>作った感想</h3><label>評価<select id="rating"><option value="0">未評価</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${+r.rating===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select></label><label>感想・次回の改善メモ<textarea id="review">${esc(r.review||'')}</textarea></label><button onclick="saveReview('${r.id}')">記録する</button></div>${r.url?`<p><a href="${esc(r.url)}" target="_blank" rel="noopener">元の動画・レシピを開く</a></p>`:''}<div class="row"><button class="secondary" onclick="editRecipe('${r.id}')">編集</button><button class="ghost danger" onclick="removeRecipe('${r.id}')">削除</button></div>`}else if(editing==='new'||editing){let r=state.recipes.find(x=>x.id===editing)||{};html=recipeForm(r)}else{html=`<h2>▤ レシピ帳</h2><div class="row"><button onclick="editing='new';render()">＋ レシピ登録</button><button class="secondary" onclick="page='import';render()">▧ スクショ取込</button></div><div class="section"><input id="search" placeholder="レシピを検索" oninput="filterRecipes()"><div class="chips" id="cats">${['すべて','肉','魚','麺','野菜','ご飯','汁物','お菓子','その他'].map(c=>`<button class="${category===c?'':'secondary'}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div id="recipeList">${state.recipes.filter(r=>category==='すべて'||r.category===category).map(recipeCard).join('')||'<div class="empty">レシピを登録してみよう！</div>'}</div></div>`}}else if(page==='import'){html=`<h2>▧ スクショ一括取り込み</h2><div class="card soft"><p>複数のスクショを選んで、iPhone上で文字を読み取るよ。画像はサーバーにアップロードしません。</p><label>スクショを選択（複数OK）<input type="file" id="screens" accept="image/*" multiple></label><button onclick="runOCR()" id="ocrBtn">文字を読み取る</button><p class="mini muted" id="ocrStatus">初回は日本語OCRデータの読み込みが必要です。ネット接続時に利用してください。</p></div><div id="ocrResults"></div><div class="card"><h3>文字をコピーして登録する方法</h3><p class="mini">iPhoneの写真アプリでスクショの文字をコピーし、下に貼り付けても登録できるよ。</p><textarea id="pasted" placeholder="材料・調味料・作り方などを貼り付け"></textarea><button onclick="fromPaste()">この文章からレシピ作成</button></div>`}else if(page==='settings'){html=`<h2>設定・バックアップ</h2><div class="card"><h3>データを書き出す</h3><p class="mini">機種変更やSafariのデータ削除に備えて、定期的にiPhoneの「ファイル」に保存してね。</p><button onclick="backup()">バックアップを保存（JSON）</button></div><div class="card"><h3>バックアップから復元</h3><p class="mini">復元すると現在のデータが置き換わるよ。</p><input type="file" id="restore" accept=".json,application/json"><button class="secondary" onclick="restore()">復元する</button></div><p class="mini muted">アプリ内のデータはこの端末のブラウザ内（IndexedDB）に保存。ブラウザデータの削除などで失われる可能性があります。</p><button class="secondary" onclick="go('home')">ホームに戻る</button>`}$('#app').innerHTML=html;$('#nav').innerHTML=tabs.map(([p,ic,n])=>`<button class="${page===p||(page==='import'&&p==='recipes')?'active':''}" onclick="go('${p}')"><span>${ic}</span>${n}</button>`).join('')}
function addShop(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.shop.unshift({id:uid(),type:shopTab,done:false,...d});save();render();toast('買い物リストに追加！')}function filterRecipes(){let q=$('#search').value.toLowerCase();$('#recipeList').innerHTML=state.recipes.filter(r=>(category==='すべて'||r.category===category)&&[r.name,r.ingredients?.join(' '),r.steps].join(' ').toLowerCase().includes(q)).map(recipeCard).join('')||'<div class="empty">見つからなかったよ</div>'}function openRecipe(id){detail=id;render();scrollTo(0,0)}function saveReview(id){let r=state.recipes.find(x=>x.id===id);r.rating=$('#rating').value;r.review=$('#review').value;r.cooked=true;save();render();toast('感想を保存したよ ♡')}function removeRecipe(id){if(!confirm('レシピを削除しますか？'))return;state.recipes=state.recipes.filter(x=>x.id!==id);detail=null;save();render()}function editRecipe(id){detail=null;editing=id;render()}
function recipeForm(r={}){return `<h2>${r.id?'レシピを編集':'新しいレシピ'}</h2><form class="card" onsubmit="saveRecipe(event,'${r.id||''}')"><label>料理名<input name="name" required value="${esc(r.name||'')}"></label><label>カテゴリ<select name="category">${['肉','魚','麺','野菜','ご飯','汁物','お菓子','その他'].map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>材料・調味料（1行に1つ）<textarea name="ingredients" style="min-height:145px" placeholder="鶏もも肉 300g&#10;醤油 大さじ2">${esc((r.ingredients||[]).join('\n'))}</textarea></label><label>作り方<textarea name="steps" style="min-height:135px">${esc(r.steps||'')}</textarea></label><label>動画・レシピのURL<input name="url" type="url" value="${esc(r.url||'')}"></label><label>料理の写真（任意）<input type="file" id="recipePhoto" accept="image/*"></label><button>保存する</button> <button type="button" class="secondary" onclick="editing=null;render()">キャンセル</button></form>`}async function saveRecipe(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.ingredients=d.ingredients.split('\n').map(x=>x.trim()).filter(Boolean);let old=state.recipes.find(x=>x.id===id)||{};let f=$('#recipePhoto').files[0];let photo=old.photo||'';if(f){photo=await resizeImage(f)}let r={...old,...d,photo,id:id||uid(),rating:old.rating||0,review:old.review||'',cooked:old.cooked||false};if(id)state.recipes=state.recipes.map(x=>x.id===id?r:x);else state.recipes.unshift(r);save();editing=null;detail=r.id;render();toast('レシピを保存したよ！')}function resizeImage(f){return new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{let scale=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.68))};im.onerror=reject;im.src=url})}function recipeToShop(id){let r=state.recipes.find(x=>x.id===id);let boxes=[...document.querySelectorAll('.card input[type=checkbox]')];let count=0;(r.ingredients||[]).forEach((line,i)=>{if(boxes[i]?.checked)return;let m=line.match(/^(.*?)(\s+((?:約)?\d[\d./]*\s*(?:g|kg|ml|L|個|本|枚|袋|束|片|大さじ|小さじ|カップ).*))$/i);let name=(m?m[1]:line).trim(),quantity=m?m[2].trim():'';if(!name)return;let exists=state.shop.find(x=>x.type==='food'&&!x.done&&x.name===name);if(exists){if(quantity&&!exists.quantity.includes(quantity))exists.quantity=[exists.quantity,quantity].filter(Boolean).join(' + ')}else state.shop.push({id:uid(),type:'food',name,quantity,done:false,source:r.name});count++});save();toast(`${count}件を買い物リストに追加！`)}
function classify(s){if(/パスタ|うどん|そば|ラーメン|そうめん|麺/.test(s))return '麺';if(/鮭|さば|鯖|魚|ぶり|タラ|鯛/.test(s))return '魚';if(/鶏|豚|牛|ひき肉|肉/.test(s))return '肉';if(/ケーキ|クッキー|プリン|お菓子/.test(s))return 'お菓子';if(/ご飯|チャーハン|丼/.test(s))return 'ご飯';if(/スープ|味噌汁/.test(s))return '汁物';if(/サラダ|野菜/.test(s))return '野菜';return 'その他'}function parseText(text){let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let name=lines.find(x=>!/^#|^@|https?:|^材料|^作り方|^調味料/.test(x))||'新しいレシピ';name=name.replace(/^【(.+)】$/,'$1').slice(0,70);let ingredients=[],steps=[],mode='';for(let line of lines){if(/^(材料|調味料|【材料|■材料|◆材料)/.test(line)){mode='ingredients';continue}if(/^(作り方|手順|【作り方|■作り方|◆作り方)/.test(line)){mode='steps';continue}if(mode==='ingredients'||(/(?:大さじ|小さじ|\d+\s*(?:g|ml|個|本|枚|袋))/.test(line)&&!/^\d+[.、．]/.test(line)))ingredients.push(line.replace(/^[・●◯\-]\s*/,''));else if(mode==='steps'||/^\d+[.、．]/.test(line))steps.push(line)}return {name,category:classify(name+' '+text),ingredients,steps:steps.join('\n')||text,url:''}}function fromPaste(){let text=$('#pasted').value.trim();if(!text)return toast('文章を貼り付けてね');let r=parseText(text);state.recipes.unshift({...r,id:uid(),rating:0,review:'',cooked:false});save();detail=state.recipes[0].id;page='recipes';render();toast('確認して必要なら編集してね')}
async function runOCR(){let files=[...$('#screens').files];if(!files.length)return toast('スクショを選んでね');$('#ocrBtn').disabled=true;$('#ocrStatus').textContent='日本語の読み取りエンジンを準備中…';try{if(!window.Tesseract){await new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.append(s)})}let worker=await Tesseract.createWorker('jpn+eng');ocrDraft=[];for(let i=0;i<files.length;i++){ $('#ocrStatus').textContent=`${i+1} / ${files.length} 枚を読み取り中…`;let result=await worker.recognize(files[i]);ocrDraft.push({text:result.data.text,selected:true})}await worker.terminate();$('#ocrStatus').textContent='読み取り完了！ 内容を確認してから登録してね。';renderOCR()}catch(e){$('#ocrStatus').textContent='読み取りに失敗しました。通信環境を確認するか、下の貼り付け機能を使ってね。';console.error(e)}finally{$('#ocrBtn').disabled=false}}function renderOCR(){$('#ocrResults').innerHTML=ocrDraft.map((x,i)=>`<div class="card"><h3>スクショ ${i+1}</h3><label>読み取った文章（編集OK）<textarea id="ocr${i}" style="min-height:155px">${esc(x.text)}</textarea></label></div>`).join('')+`<div class="card soft"><p class="mini">1枚につき1件のレシピとして仮登録します。同じ料理の複数枚は、登録前に文章を1つにまとめてね。</p><button onclick="saveOCR()">${ocrDraft.length}件をまとめて登録</button></div>`}function saveOCR(){let added=0;ocrDraft.forEach((x,i)=>{let t=$('#ocr'+i)?.value.trim();if(!t)return;state.recipes.unshift({...parseText(t),id:uid(),rating:0,review:'',cooked:false});added++});save();ocrDraft=[];page='recipes';render();toast(`${added}件を登録したよ！`)}
function backup(){let b=new Blob([JSON.stringify({app:'my-little-list',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='my-little-list-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(){let f=$('#restore').files[0];if(!f)return toast('ファイルを選んでね');try{let d=JSON.parse(await f.text());if(d.app!=='my-little-list'||!d.state||!Array.isArray(d.state.recipes))throw Error('形式が違います');if(!confirm('現在のデータを上書きします。よろしいですか？'))return;state=d.state;save();go('home');toast('復元できたよ！')}catch(e){alert('バックアップファイルを読み込めませんでした')}}init().catch(e=>{document.querySelector('#app').innerHTML='<p>データ保存を開始できませんでした。Safariで開いてみてください。</p>';console.error(e)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
